<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Now, Cry Later</title>
    <link rel="stylesheet" href="./src/css/lpstyle.css">
</head>
<body>
    <header>
        <h1>Buy Now, Cry Later</h1>
        <p>Trade stocks, build your portfolio, and reach financial goals.</p>
    </header>

    <main>
        <div class="form-row">
            <!-- Login Form -->
            <section class="auth-section">
                <h2>Log In</h2>
                <form id="loginForm">
                    <input type="email" id="loginEmail" placeholder="Enter your email" required />
					
                    <input type="password" id="loginPassword" placeholder="Enter your password" required />
                    <button type="submit">Login</button>
                </form>
            </section>

            <!-- User Account Creation Form -->
            <section class="auth-section">
                <h2>Create an Account</h2>
                <form id="registerForm">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>

                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" name="username" placeholder="johndoe" required>

                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" name="email" placeholder="john@example.com" required>

                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="password" placeholder="••••••••" required>

                    <button type="submit">Create Account</button>
                </form>
            </section>
        </div>
        <hr>
    </main>

    <!-- Load Supabase CDN Library First -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Load Application JS Second -->
    <script src="./src/js/app.js"></script>
</body>
</html>
