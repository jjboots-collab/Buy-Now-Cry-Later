<!-- ADMIN -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Now, Cry Later - Admin Panel</title>
    <link rel="stylesheet" href="../src/css/main.css">
</head>
<body>
    <header>
        <h1>Administrator Control Panel</h1>
        <p>Buy Now, Cry Later Platform Management</p>
    </header>

    <main>
        <!-- Process 2.0: Create New Stock -->
        <section class="admin-section">
            <h2>Process 2.0: Add New Stock</h2>
            <form id="createStockForm">
                <label for="stockTicker">Ticker Symbol:</label>
                <input type="text" id="stockTicker" name="ticker" placeholder="e.g., AAPL" required>

                <label for="companyName">Company Name:</label>
                <input type="text" id="companyName" name="companyName" placeholder="e.g., Apple Inc." required>

                <label for="stockVolume">Total Volume:</label>
                <input type="number" id="stockVolume" name="volume" placeholder="e.g., 1000000" min="1" required>

                <label for="initialPrice">Initial Share Price ($):</label>
                <input type="number" id="initialPrice" name="price" step="0.01" placeholder="e.g., 150.00" min="0.01" required>

                <button type="submit">Create Stock</button>
            </form>
        </section>

        <hr>

        <!-- Process 3.0: Market Schedule Management -->
        <section class="admin-section">
            <h2>Process 3.0: Set Market Operating Schedule</h2>
            <form id="marketSettingsForm">
                <label for="openTime">Market Open Time:</label>
                <input type="time" id="openTime" name="openTime" required>

                <label for="closeTime">Market Close Time:</label>
                <input type="time" id="closeTime" name="closeTime" required>

                <fieldset>
                    <legend>Operational Days:</legend>
                    <label><input type="checkbox" name="opDays" value="Monday" checked> Mon</label>
                    <label><input type="checkbox" name="opDays" value="Tuesday" checked> Tue</label>
                    <label><input type="checkbox" name="opDays" value="Wednesday" checked> Wed</label>
                    <label><input type="checkbox" name="opDays" value="Thursday" checked> Thu</label>
                    <label><input type="checkbox" name="opDays" value="Friday" checked> Fri</label>
                    <label><input type="checkbox" name="opDays" value="Saturday"> Sat</label>
                    <label><input type="checkbox" name="opDays" value="Sunday"> Sun</label>
                </fieldset>

                <label for="holidayDates">Holidays (YYYY-MM-DD, comma-separated):</label>
                <input type="text" id="holidayDates" name="holidayDates" placeholder="2026-12-25, 2026-01-01">

                <button type="submit">Update Schedule</button>
            </form>
        </section>
    </main>

    <!-- 1. Supabase CDN Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Single Application Logic File -->
    <script src="../src/js/app.js"></script>
</body>
</html>
