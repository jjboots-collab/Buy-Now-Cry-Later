<!-- ADMIN CONTROL/DASHBOARD -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Now, Cry Later - Admin Panel</title>
    <link rel="stylesheet" href="../src/css/main.css">
</head>
<body>
    <header>
        <h1>Administrator Control Panel</h1>
        <p>Buy Now, Cry Later Platform Management</p>
    </header>

    <main>
        <!-- Process 2.0: Create New Stock -->
        <section class="admin-section">
            <h2>Process 2.0: Add New Stock</h2>
            <form id="createStockForm">
                <label for="ticker">Ticker Symbol:</label>
                <input type="text" id="ticker" name="ticker" placeholder="e.g., AAPL" required>

                <label for="companyName">Company Name:</label>
                <input type="text" id="companyName" name="companyName" placeholder="e.g., Apple Inc." required>

                <label for="volume">Total Volume:</label>
                <input type="number" id="volume" name="volume" placeholder="e.g., 1000000" min="1" required>

                <label for="price">Initial Share Price ($):</label>
                <input type="number" id="price" name="price" step="0.01" placeholder="e.g., 150.00" min="0.01" required>

                <button type="submit">Create Stock</button>
            </form>
        </section>

        <hr>

        <!-- Process 3.0: Market Schedule Management -->
        <section class="admin-section">
            <h2>Process 3.0: Set Market Operating Schedule</h2>
            <form id="scheduleForm">
                <label for="openTime">Market Open Time:</label>
                <input type="time" id="openTime" name="openTime" required>

                <label for="closeTime">Market Close Time:</label>
                <input type="time" id="closeTime" name="closeTime" required>

                <label for="isActiveDay">
                    <input type="checkbox" id="isActiveDay" name="isActiveDay" checked>
                    Market Active Today
                </label>

                <button type="submit">Update Schedule</button>
            </form>
        </section>
    </main>

    <!-- Connects UI events to frontend JS logic -->
    <script type="module" src="../src/js/app.js"></script>
</body>
</html>
