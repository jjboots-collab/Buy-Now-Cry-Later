<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Stocks - Buy Now, Cry Later</title>
    <link rel="stylesheet" href="./src/css/main.css">
</head>
<body>
    <header>
        <div class="header-text">
            <h1>View Stocks / Buy Stocks</h1>
            <h2>Cash Balance: <span id="userCashDisplay"></span></h2>
        </div>

        <!-- Nav Buttons-->
        <nav class="main-nav">
            <a class="nav-btn active" href="dashboard.html">Dashboard</a>
            <a class="nav-btn" href="viewstocks.html">View Stocks</a>
            <a class="nav-btn" href="transactionhistory.html">Transaction History</a>
        </nav>
    </header>

    <main>
        <!-- Two forms side by side -->
        <div class="form-row">
            <!-- Deposit or Withdraw Cash -->
            <section class="dashboard-section">
                <h3>Manage Cash Account</h3>
                <form id="cashForm">
                    <label for="cashAction">Action:</label>
                    <select id="cashAction" name="cashAction" required>
                        <option value="DEPOSIT">Deposit</option>
                        <option value="WITHDRAW">Withdraw</option>
                    </select>

                    <label for="cashAmount">Amount ($):</label>
                    <input type="number" id="cashAmount" name="cashAmount" step="0.01" min="0.01" placeholder="e.g., 500.00" required>

                    <button type="submit">Execute Cash Action</button>
                </form>
            </section>



            <!-- Buy Stock -->
            <section class="dashboard-section">
                <h3>Buy Stock</h3>
                <form id="buyStockForm">
                    <label for="buyTicker">Stock Ticker:</label>
                    <input type="text" id="buyTicker" name="buyTicker" placeholder="e.g., BNCL" required>

                    <label for="buyVolume">Quantity:</label>
                    <input type="number" id="buyVolume" name="buyVolume" min="1" placeholder="e.g., 5" required>

                    <button type="submit">Buy Shares</button>
                </form>
            </section>
        </div>

        <hr>

        <!-- View Stocks -->
        <section class="dashboard-section">
            <h3>View Stocks</h3>
            <table border="3" style="width: 100%; text-align: left; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th>Company Name</th>
                        <th>Ticker</th>
                        <th>Current Price</th>
                        <th>Available Volume</th>
                        <th>Market Value</th>
                        <th>Daily High</th>
                        <th>Daily Low</th>
                        <th>Owned Shares</th>
                    </tr>
                </thead>
                <tbody id="portfolioTable">
                    <!-- Dynamic Rows Rendered by app.js -->
                </tbody>
            </table>
        </section>


                    <!-- Dynamic Rows Rendered by app.js -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Supabase CDN Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Single Application Logic File -->
    <script src="./src/js/app.js"></script>
</body>
</html>
